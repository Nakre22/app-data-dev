- id: about
  label: À propos
  surface: ink
  blocks:
  - type: text
    html: L'Institut d'Analyse Interdisciplinaire des Savoirs (IAIS) est une plateforme
      de recherche interdisciplinaire qui rassemble des experts de différentes disciplines
      autour de projets innovants. Notre mission est de favoriser la collaboration
      entre chercheurs et de rendre la recherche ouverte et accessible à tous.
